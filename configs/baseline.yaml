      mean_jaccard_prediction_unchanged: 0.9014

    - nominal_mask_rate: 0.05
      prediction_stability: 0.9876
      explanation_availability: 0.9835
      mean_jaccard: 0.7253
      mean_jaccard_prediction_unchanged: 0.7266

    - nominal_mask_rate: 0.10
      prediction_stability: 0.9835
      explanation_availability: 0.9825
      mean_jaccard: 0.6045
      mean_jaccard_prediction_unchanged: 0.6063

    - nominal_mask_rate: 0.20
      prediction_stability: 0.9588
      explanation_availability: 0.9856
      mean_jaccard: 0.4541
      mean_jaccard_prediction_unchanged: 0.4560

  h4_endpoint:
    valid_nodes: 97
    mean_prediction_stability_change: -0.0381
    mean_explanation_stability_change: -0.4475
