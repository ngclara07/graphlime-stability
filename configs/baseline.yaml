# =============================================================================
# Superseded Intermediate Artifact
# =============================================================================

superseded_artifacts:
  hypothesis_summary:
    path: results/analysis/hypothesis_summary.csv
    status: superseded_intermediate
    superseded_by: results/analysis/final_hypothesis_summary.csv
    retain_for_provenance: true


# =============================================================================
# Freeze Policy
# =============================================================================

freeze_policy:
  canonical_pipeline:
    phase_0_to_11_complete: true

  model_frozen: true
  target_nodes_frozen: true
  graphlime_configuration_frozen: true
  rho_frozen: true
  perturbation_configuration_frozen: true
  raw_perturbation_results_frozen: true
  statistical_analysis_frozen: true
  figures_frozen: true

  allow_post_hoc_parameter_tuning: false
  allow_failed_node_replacement: false
  allow_manual_result_modification: false
  allow_unavailable_explanation_as_zero_jaccard: false

  future_extensions:
    require_new_experiment: true
    preserve_current_frozen_artifacts: true
