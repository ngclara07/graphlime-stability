  h5_unavailable_explanations:

    - nominal_mask_rate: 0.01
      unavailable: 12
      total: 970

    - nominal_mask_rate: 0.05
      unavailable: 16
      total: 970

    - nominal_mask_rate: 0.10
      unavailable: 17
      total: 970

    - nominal_mask_rate: 0.20
      unavailable: 14
      total: 970


